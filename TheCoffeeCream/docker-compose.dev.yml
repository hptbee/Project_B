services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=TheCoffeeCream;User Id=sa;Password=YourStrong(!)Password;TrustServerCertificate=True
    networks:
      - coffee-net

  app-admin:
    build:
      context: ./mobile
      dockerfile: apps/app-admin/Dockerfile
      target: build
    volumes:
      - ./mobile:/app
      - /app/node_modules
    command: npm run dev --workspace=app-admin -- --host --port 3000
    ports:
      - "4000:3000"
    networks:
      - coffee-net
    depends_on:
      - api

  app-staff:
    build:
      context: ./mobile
      dockerfile: apps/app-staff/Dockerfile
      target: build
    volumes:
      - ./mobile:/app
      - /app/node_modules
    command: npm run dev --workspace=app-staff -- --host --port 3001
    ports:
      - "4001:3001"
    networks:
      - coffee-net
    depends_on:
      - api

  app-owner:
    build:
      context: ./mobile
      dockerfile: apps/app-owner/Dockerfile
      target: build
    volumes:
      - ./mobile:/app
      - /app/node_modules
    # Angular specific command for host check disable and port
    command: npm run start --workspace=app-owner -- --host 0.0.0.0 --port 3002 --disable-host-check
    ports:
      - "4002:3002"
    networks:
      - coffee-net
    depends_on:
      - api

networks:
  coffee-net:
    driver: bridge
