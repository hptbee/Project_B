<div class="login-page">
  <!-- Animated Background Shapes -->
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-logo-wrapper">
          <img src="assets/icons/logo.png" alt="Logo" class="brand-logo">
        </div>
        <h1 class="brand-name">Owner Portal</h1>
        <p>Log in to manage your shops</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" [(ngModel)]="username" placeholder="Enter username" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" [(ngModel)]="password" placeholder="••••••" required>
        </div>

        <div *ngIf="error" class="error-alert">
          {{ error }}
        </div>

        <button type="submit" [disabled]="loading" class="login-btn" [class.loading]="loading">
          <span *ngIf="!loading">Login</span>
          <div *ngIf="loading" class="spinner"></div>
        </button>
      </form>

      <div class="login-footer">
        <p><strong>THE COFFEE CREAM</strong></p>
        <p class="version">v1.0.0 (Owner App)</p>
      </div>
    </div>
  </div>
</div>
